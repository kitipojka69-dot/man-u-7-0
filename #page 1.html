#page 1
<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- ชื่อหน้าตรงตาม TITLE ในใบงาน page1 -->
    <title>Home & Cart - ComPro Shopee Marketplace</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <div class="header-container">
            <h1>🧡 ComPro Marketplace (Page 1)</h1>
            <p>หน้าหลักสำหรับเลือกซื้อสินค้าและระบบตะกร้า (อ้างอิงข้อมูลจาก Shopee)</p>
        </div>
    </header>

    <div class="main-layout">
        <!-- ส่วนที่ 1: รายการสินค้า (ตรงกับ catalog: list / gallery ในใบงาน) -->
        <main class="products-area">
            <h2>🛒 สินค้าแนะนำยอดฮิตสำหรับคุณ</h2>
            <div class="products-grid" id="productsGrid">
                <!-- ดึงข้อมูลสินค้าจาก data.json มาลูปแสดงผลตรงนี้ -->
            </div>
        </main>

        <!-- ส่วนที่ 2: ตะกร้าสินค้า (ตรงกับ catalog: cart ในใบงาน) -->
        <aside class="sidebar-area">
            <div class="card-box cart-box">
                <h3>🛍️ ตะกร้าสินค้าของคุณ</h3>
                <ul id="cartList">
                    <li class="empty-text">ยังไม่มีสินค้าในตะกร้า</li>
                </ul>
                <div class="cart-summary">
                    <h4>ยอดรวมออเดอร์: <span id="cartTotal">0</span> บาท</h4>
                    <!-- ฟอร์มและปุ่มกดเพื่อส่งข้อมูลคำนวณ -->
                    <button class="btn-checkout" onclick="processCheckout()">⚡ ยืนยันการสั่งซื้อ</button>
                </div>
            </div>
        </aside>
    </div>

    <script src="script.js"></script>
</body>
</html>
